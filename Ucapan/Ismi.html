<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Semhas! 🎓</title>
    <!-- Font Google & Confetti Library -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: popUp 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        /* CSS Untuk Foto */
        .profile-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #3b82f6, #ec4899);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
        }

        h1 {
            color: #1e293b;
            font-size: 1.7rem;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        p {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .highlight {
            color: #0284c7;
            font-weight: 600;
        }
        button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }
        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">ONE STEP CLOSER 🎓</div>
        
        <!-- BAGIAN FOTO TEMAN -->
        <div class="profile-container">
            <!-- Masukkan nama file / link foto temanmu di attribute src di bawah -->
            <img src="foto/IMG-20250912-WA0191.jpg" alt="Foto Teman" class="profile-img">
        </div>

        <!-- Ganti [Nama Teman] dengan nama temanmu -->
        <h1>Selamat Seminar Hasil, <span class="highlight">Ismiati Maulida</span>! 🎉</h1>
        
        <p>
            Keren banget akhirnya satu beban besar terlewati! Keringat dan pusing revisinya terbayar tuntas hari ini.<br><br>
            Sedikit lagi menuju Sidang Akhir & Wisuda. Tetap semangat, jaga kesehatan, dan tancap gas sampai lulus! 💪✨
        </p>
        
        <button onclick="celebrate()">Rayakan! 🥳</button>
    </div>

    <script>
        // Efek kembang api/confetti saat tombol diklik
        function celebrate() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
        
        // Panggil confetti otomatis saat halaman pertama dibuka
        window.onload = function() {
            setTimeout(celebrate, 500);
        };
    </script>

</body>
</html>
